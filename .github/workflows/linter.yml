name: "Clang-format"

on:
  workflow_call:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update pkg db
        run: sudo apt-get update

      - name: Install Clang/LLVM 21
        run: |
          set -e
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21 all
          sudo apt-get install -y clang-format-21
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-21 100

      - name: Check versions
        run: clang-format-21 --version
          
      - name: Check formatting
        run: |
          find . -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
            -not -path './build/*' \
            -not -path './.git/*' \
            -not -path './.cache/*' \
            -not -path './vcpkg_installed/*' \
            | xargs clang-format-21 --dry-run --Werror
