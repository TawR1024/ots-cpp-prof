name: "Release"

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and package
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}-${{ github.run_number }}"
          echo "Building version: $VERSION"
          cmake -B build -DPACKAGE_VERSION="$VERSION"
          cmake --build build
          cmake --build build --target package
      - name: Set package filename
        id: pkg
        run: |
          SRC=$(ls build/*.deb)
          DST="${{ inputs.package_name }}.deb"
          mv "$SRC" "$DST"
          echo "FILE=$DST" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./${{ steps.pkg.outputs.FILE }}
          asset_name: ${{ steps.pkg.outputs.FILE }}
          asset_content_type: application/vnd.debian.binary-package